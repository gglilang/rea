name: Sync fork with upstream

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 08:00 越南时间（UTC 01:00）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream morluto/rea into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
